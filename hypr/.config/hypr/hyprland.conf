# hyprland.conf — managed by Stow from hyprland-rice/hypr/.config/hypr/
# Colors below come from matugen (see ~/.config/matugen/), regenerated on
# every login from the current wallpaper — do not hand-edit colors.conf.
source = ~/.config/hypr/colors.conf

monitor = , preferred, auto, 1

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORMTHEME,qt5ct

# --- Autostart ---
# matugen must run before anything that reads its generated colors.
exec-once = matugen image ~/.config/hypr/wallpaper.png -m dark --prefer=saturation
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
# hypridle owns locking: it invokes hyprlock itself when the idle timeout
# hits (see hypridle.conf) — hyprlock is intentionally NOT exec-once'd here,
# since that would lock the session immediately on every login.
exec-once = hypridle
exec-once = eww daemon
exec-once = nwg-dock-hyprland

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $surface_variant
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.92

    # "Glass" look via Hyprland's native blur options — contrast/vibrancy/
    # vibrancy_darkness are real built-in params, not a custom shader system.
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 1.15
        brightness = 1.0
        vibrancy = 0.3
        vibrancy_darkness = 0.4
        popups = true
    }

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(0000009a)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, smooth
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth
    animation = border, 1, 4, smooth
}

dwindle {
    pseudotile = true
    preserve_split = true
}

gestures {
    workspace_swipe = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Waybar/eww/rofi are layer-shell surfaces, not regular windows — blur only
# applies to them via layerrule, not the decoration block above.
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, eww
layerrule = ignorezero, eww
layerrule = blur, rofi
layerrule = ignorezero, rofi

# Claude Code scratchpad (Phase 6) — pinned to its own special workspace,
# floating and centered, regardless of which real workspace it's toggled
# from. SUPER+grave confirmed unclaimed by any other bind in this file.
# NB: "windowrulev2" is deprecated in this Hyprland version (0.56.1) —
# "windowrule" is now the unified keyword using the same v2-style syntax.
windowrule = workspace special:claude silent, class:^(claude-scratchpad)$
windowrule = float, class:^(claude-scratchpad)$
windowrule = size 75% 80%, class:^(claude-scratchpad)$
windowrule = center, class:^(claude-scratchpad)$

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/show-keybinds.sh
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, W, exec, wlogout
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, grave, exec, ~/agent-scripts/toggle-claude-scratchpad.sh
bind = $mainMod, F, fullscreen
bind = $mainMod, X, exec, eww open --toggle proxmox-dashboard

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
