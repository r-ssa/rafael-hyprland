# hyprland.conf — managed by Stow from hyprland-rice/hypr/.config/hypr/
# Colors below come from matugen (see ~/.config/matugen/), regenerated on
# every login from the current wallpaper — do not hand-edit colors.conf.
source = ~/.config/hypr/colors.conf

# Catch-all for the primary monitor (and anything unrecognized) — must stay
# first: Hyprland's auto-* positions on a named rule misbehave if that rule
# is the very first one parsed (hyprwm/Hyprland#8529).
monitor = , preferred, auto, 1

# Primary: DP-4, pinned to its max non-overclocked refresh (200Hz is a
# listed mode; 210Hz is a driver overclock, deliberately not used here).
monitor = DP-4, 2560x1440@200, auto, 1

# Second monitor: 1920x1080 physical panel mounted vertically to the left
# of the primary, rotated 90° clockwise (transform 1), capped at 100Hz.
# Position is calculated from the *transformed* (i.e. 1080x1920) size
# automatically by auto-left.
monitor = HDMI-A-3, 1920x1080@100, auto-left, 1, transform, 1

# HDMI-A-4 (the ZeroMOD panel) disabled outright — not part of the layout.
monitor = HDMI-A-4, disable

# Pin workspace IDs to monitors so switching is predictable instead of
# Hyprland dynamically (mis)assigning workspaces to whichever monitor asks
# first — this was the root cause of SUPER+1/2/3 landing on the wrong
# monitor or doing nothing. Not exposed via SUPER+number binds — this just
# keeps each monitor's workspace range stable under ALT+Tab cycling below.
# No persistent:true: an empty workspace (windows closed manually, or via
# delete-workspace.sh) is garbage-collected by Hyprland once you switch
# away from it — it's just recreated (empty, on the right monitor per
# these rules) the next time ALT+Tab/new-workspace.sh lands back on that
# id, so nothing is actually lost by letting it disappear meanwhile.
workspace = 1, monitor:DP-4, default:true
workspace = 2, monitor:DP-4
workspace = 3, monitor:DP-4
workspace = 4, monitor:DP-4
workspace = 5, monitor:DP-4
workspace = 6, monitor:HDMI-A-3, default:true
workspace = 7, monitor:HDMI-A-3
workspace = 8, monitor:HDMI-A-3
workspace = 9, monitor:HDMI-A-3

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORMTHEME,qt5ct

# --- Autostart ---
# theme-init.sh must run before anything that reads matugen's generated
# colors — it wraps the same `matugen image ...` call, but first checks for
# a manually-pinned accent color (see set-theme-color.sh) so a color you
# picked survives across logins instead of being overwritten by the
# wallpaper-derived scheme every time.
exec-once = ~/.config/hypr/scripts/theme-init.sh
# wpaperd replaced hyprpaper — built from source (cargo install --path
# daemon), not packaged, so it lands in ~/.cargo/bin rather than /usr/bin.
exec-once = ~/.cargo/bin/wpaperd -d
exec-once = waybar
exec-once = swaync
# hypridle owns locking: it invokes hyprlock itself when the idle timeout
# hits (see hypridle.conf) — hyprlock is intentionally NOT exec-once'd here,
# since that would lock the session immediately on every login.
exec-once = hypridle
exec-once = eww daemon
# Loads plugins enabled via hyprpm (see bootstrap.sh) — hyprpm's enabled
# state isn't automatically reloaded into a fresh Hyprland session on its
# own, this line is what actually does it. -n gives a notification on
# success/failure.
exec-once = hyprpm reload -n

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $surface_variant
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    # Focused windows need to be less than fully opaque or there's nothing
    # for blur/hyprglass to composite against on the window you're actually
    # looking at — a value of 1.0 here silently kills the glass effect.
    active_opacity = 0.92
    inactive_opacity = 0.88

    # "Glass" look via Hyprland's native blur options — contrast/vibrancy/
    # vibrancy_darkness are real built-in params, not a custom shader system.
    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        contrast = 1.15
        brightness = 1.0
        vibrancy = 0.3
        vibrancy_darkness = 0.4
        popups = true
    }

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(0000009a)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, smooth
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth
    animation = border, 1, 4, smooth
}

dwindle {
    preserve_split = true
}

# Hyprland 0.51+ replaced the old gestures{workspace_swipe=...} toggle with
# per-gesture bindings — this is the equivalent 3-finger horizontal swipe.
gestures {
    gesture = 3, horizontal, workspace
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

debug {
    # NVIDIA (nvidia-open 610.43.03 here) has a long-standing damage-tracking
    # bug: blurred/shader-decorated regions only actually redraw on the
    # frame something invalidates them (e.g. a window drag), then stay
    # stale/undrawn on an otherwise static window — this is why blur and
    # hyprglass rendered nothing until this was disabled. Confirmed live:
    # background content behind a floating window was crisp/unblurred with
    # this at its default, and genuinely frosted once disabled. Costs a
    # full-frame redraw every frame instead of damage-tracked partial
    # redraws — a real GPU/power tradeoff, but this GPU has headroom.
    damage_tracking = 0
}

# hyprglass (installed/enabled via hyprpm — see bootstrap.sh) adds lens/
# diffraction/refraction "liquid glass" effects on top of the native blur
# configured above. It requires decoration.shadow to be enabled, which it
# already is.
plugin:hyprglass {
    default_theme = dark
    default_preset = clear
    blur_strength = 2.0
    glass_opacity = 1.0
}

# Waybar/eww/rofi are layer-shell surfaces, not regular windows — blur only
# applies to them via layerrule, not the decoration block above.
layerrule = match:namespace waybar, blur on
layerrule = match:namespace eww, blur on
layerrule = match:namespace rofi, blur on

# Claude Code scratchpad (Phase 6) — pinned to its own special workspace,
# floating and centered, regardless of which real workspace it's toggled
# from. SUPER+grave confirmed unclaimed by any other bind in this file.
# NB: Hyprland 0.53 overhauled windowrule syntax — rules now use a
# "match:<prop> <value>" selector instead of the old "class:<regex>"
# suffix, and boolean effects (float, center) require an explicit "on".
windowrule = match:class ^(claude-scratchpad)$, workspace special:claude silent
windowrule = match:class ^(claude-scratchpad)$, float on
windowrule = match:class ^(claude-scratchpad)$, size 75% 80%
windowrule = match:class ^(claude-scratchpad)$, center on

# Spotify: floating card over the wallpaper instead of tiled, matching the
# rounded-corner "rice" look — rounding/shadow already come from the global
# decoration block, this just stops it from tiling.
windowrule = match:class ^(Spotify)$, float on
windowrule = match:class ^(Spotify)$, size 65% 75%
windowrule = match:class ^(Spotify)$, center on

# Vesktop: same floating-card treatment. Transparency comes from Vesktop's
# own "transparent" setting (see vesktop-sync-theme.sh) plus a theme from
# Vencord's Themes tab — Hyprland's opacity/blur alone can't reach into an
# Electron app's own opaque-by-default rendering.
windowrule = match:class ^(vesktop)$, float on
windowrule = match:class ^(vesktop)$, size 65% 75%
windowrule = match:class ^(vesktop)$, center on

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

bind = $mainMod, Return, exec, $terminal # Open terminal
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/show-keybinds.sh # Show this keybind list
# -b 7 forces exactly one row of 7 buttons, matching the 7 tiles in
# wlogout/layout — wlogout's default auto-grid pads an incomplete last
# row with broken placeholder widgets (confirmed: that's what threw the
# gtk_label_set_yalign/xalign GTK-CRITICAL warnings and made the menu
# flaky/unclickable). If you add or remove a tile in layout, update this
# number to match.
bind = $mainMod, Q, exec, pkill -x wlogout || wlogout -b 7 # Power menu (press again to close)
bind = $mainMod, E, exec, $fileManager # Open file manager
bind = $mainMod, V, togglefloating # Toggle floating for focused window
bind = $mainMod, R, exec, $menu # App launcher
bind = $mainMod, P, pseudo # Toggle pseudotiling for focused window
bind = $mainMod, J, layoutmsg, togglesplit # Toggle split direction
bind = $mainMod, W, killactive # Close focused window
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy # Screenshot a selected region to clipboard
bind = $mainMod, grave, exec, ~/agent-scripts/toggle-claude-scratchpad.sh # Toggle Claude Code scratchpad
bind = $mainMod, F, fullscreen # Toggle fullscreen
bind = $mainMod, X, exec, eww open --toggle proxmox-dashboard # Toggle Proxmox dashboard
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/pick-theme-color.sh # Pick accent theme color

bind = $mainMod, left, movefocus, l # Focus window left
bind = $mainMod, right, movefocus, r # Focus window right
bind = $mainMod, up, movefocus, u # Focus window up
bind = $mainMod, down, movefocus, d # Focus window down

# No SUPER+number, no SUPER+SHIFT+number: workspaces are pinned to
# monitors (see the workspace = lines near the top) but not exposed via
# fixed numbers. ALT+Tab cycles them, and SUPER+scroll moves the grabbed
# window between them (both below) — no numbers to remember, no dedicated
# "send window to workspace N" binds.

bindm = $mainMod, mouse:272, movewindow # Move window (hold and drag)

# ALT+Tab: step to the next workspace on the focused monitor — each
# workspace is "a set of apps," so this moves between the sets living on
# the same monitor. One bind, one direction: no SUPER+Tab, no Shift+Tab
# reverse, no submap-based per-window switcher.
bind = ALT, Tab, exec, ~/.config/hypr/scripts/workspace-cycle.sh next # Next workspace on this monitor
# SHIFT+ALT+Tab: create a new empty workspace on the focused monitor and
# switch to it. workspace-cycle.sh will include it going forward since it
# reads live workspaces on the monitor, not just the pinned 1-9 list.
bind = ALT SHIFT, Tab, exec, ~/.config/hypr/scripts/new-workspace.sh # New workspace on this monitor
# SUPER+CTRL+Tab: close every window on the current workspace and hop to
# the previous workspace on this monitor — "deleting" the workspace you
# were just on (a dynamically-created one actually disappears once
# empty; a pinned 1-9 one just goes back to being empty and reusable).
bind = $mainMod CTRL, Tab, exec, ~/.config/hypr/scripts/delete-workspace.sh # Close workspace's windows and leave

# SUPER+scroll: move the focused/grabbed window to the next/previous
# workspace on this monitor and follow it there — so holding SUPER+drag
# on a window (the movewindow bind above) and scrolling the wheel swaps
# it straight to the adjacent workspace mid-drag.
bind = $mainMod, mouse_down, exec, ~/.config/hypr/scripts/move-window-workspace.sh next # Move window to next workspace on this monitor
bind = $mainMod, mouse_up, exec, ~/.config/hypr/scripts/move-window-workspace.sh prev # Move window to previous workspace on this monitor
