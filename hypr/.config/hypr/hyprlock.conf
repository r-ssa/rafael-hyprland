source = ~/.config/hypr/colors.conf

background {
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 3
    blur_size = 8
}

general {
    hide_cursor = false
    no_fade_in = false
}

input-field {
    size = 260, 60
    outline_thickness = 2
    dots_size = 0.25
    outer_color = $accent
    inner_color = $surface
    font_color = $on_background
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Password...</span>
    position = 0, -40
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $on_background
    font_size = 64
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = $on_background
    font_size = 20
    position = 0, 90
    halign = center
    valign = center
}
