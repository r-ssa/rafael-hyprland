# menu-style.conf — shared "scratchpad look" recipe for every dismissible
# popup menu (power menu, volume popup, proxmox dashboard, and any future
# one). Sourced from hyprland.conf. See README.md in this directory for
# the checklist a new menu should follow.
#
# Two coexisting patterns, depending on what the menu actually is:
#
#  A) Layer-shell popups (eww, rofi, wlogout, waybar) — blur + dim here,
#     via layerrule, keyed by Hyprland layer-shell namespace (run
#     `hyprctl layers` while the menu is open to find its real namespace).
#     Opacity/rounding/border are NOT settable via layerrule — replicate
#     the values below in the menu's own stylesheet by hand:
#       opacity 0.92 / rounding 12px / 2px border
#     (matches decoration{ active_opacity, rounding, border_size } in
#     hyprland.conf).
#
#  B) Real windows (like the Claude/Qwen scratchpads) — put the window on
#     its own `special:<name>` workspace via windowrule; opacity, blur,
#     rounding, border, and pop-in animation all come for free from the
#     global decoration{}/animations{} blocks, and background dimming
#     comes from Hyprland's native dim_special (see decoration.dim_around
#     in hyprland.conf — pinned to 0.2 to match). No per-menu layerrule
#     needed at all for this pattern. See hyprland.conf's windowrule
#     block for the claude-scratchpad/qwen-scratchpad examples.
#
# --- Pattern A: layer-shell namespaces currently in use ---
layerrule = match:namespace waybar, blur on

layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, dim_around on

layerrule = match:namespace gtk-layer-shell, blur on
# Every eww window (power-menu, volume-popup, proxmox-dashboard, and the
# always-on system-dashboard) shares this ONE namespace — eww 0.5 has no
# per-window namespace option (verified with `hyprctl layers`). Enabling
# dim_around here is still safe: system-dashboard sits at the "bg" layer
# level, so its own dim_around request only darkens the wallpaper behind
# it (never visible — always-on desktop apps/wallpaper cover it), while
# power-menu/volume-popup/proxmox-dashboard sit at "top"/"overlay" and so
# their dim_around actually darkens the desktop behind them, which is
# exactly the effect we want. Verified live with grim screenshots on both
# monitors (one with system-dashboard, one without) before relying on
# this — see git history for the captures.
layerrule = match:namespace gtk-layer-shell, dim_around on

# --- Escape-to-close ---
# Any menu that wants Escape to dismiss it should enter this submap right
# as it opens (see scripts/toggle-menu.sh) and the submap resets itself
# back to normal the moment the menu closes via ANY path — Escape here,
# an outside click (scripts/close-all-menus.sh, called from
# eww-outside-click-watcher.sh), or one of the menu's own buttons calling
# close-all-menus.sh directly.
#
# Deliberately minimal: only Escape is rebound here, so every other
# keybind is briefly unavailable while a menu is open (closing it, by any
# of the methods above, immediately restores them). This is intentional
# modal-style behavior, not an oversight — see README.md.
submap = menu
bind = , Escape, exec, ~/.config/hypr/scripts/close-all-menus.sh
submap = reset
