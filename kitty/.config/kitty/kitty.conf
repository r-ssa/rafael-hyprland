# Colors come from matugen (see ~/.config/matugen/) regenerated on every
# login — don't hand-edit colors.conf.
include colors.conf

# Kitty defaults to background_opacity 1.0 (fully opaque) if this is unset
# at all — that's why terminals looked solid regardless of Hyprland's own
# blur/opacity working correctly. dynamic_background_opacity lets it be
# adjusted live with ctrl+shift+a m / ctrl+shift+a l.
background_opacity 0.85
dynamic_background_opacity yes

font_family JetBrainsMono Nerd Font
font_size 11.0

confirm_os_window_close 0
